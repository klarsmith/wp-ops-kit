# The bearer token that gates /wp-json/ops/v1/metrics. Two consumers read it:
#
#   1. the WordPress pods, via `envFrom: secretRef` -> env var WP_OPS_TOKEN
#      (the key name IS the variable name, which is why the key is WP_OPS_TOKEN);
#   2. the scraper, via `bearerTokenSecret: {name: wp-ops-token, key: WP_OPS_TOKEN}`.
#
# Both must be in the same namespace as this Secret — prometheus-operator and the
# VictoriaMetrics operator only read bearerTokenSecret from the scrape object's own
# namespace.
#
# Generate a token:
#
#   openssl rand -base64 32
#
# Leaving WP_OPS_TOKEN unset (or the Secret absent) disables /metrics entirely —
# the endpoint answers 404 rather than serving unauthenticated. A wrong token
# also answers 404, not 401, so a scrape target flapping to "down" right after a
# token rotation is the first thing to check.
#
# Do not commit a real token in plain text. Encrypt this file with SOPS
# (`sops -e -i wp-ops-token-secret.yaml` with an `encrypted_regex: ^(data|stringData)$`
# rule) or replace it with an ExternalSecret that pulls the value from your
# secrets manager and materialises a Secret of this exact shape.
apiVersion: v1
kind: Secret
metadata:
  name: wp-ops-token
  labels:
    app: wordpress
type: Opaque
stringData:
  WP_OPS_TOKEN: REPLACE-WITH-OUTPUT-OF-openssl-rand-base64-32
