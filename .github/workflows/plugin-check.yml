name: Plugin Check

# The wordpress.org directory reviews submissions with the Plugin Check tool.
# Run the same checks here so a rejection never comes as a surprise. Hosted
# runner: the action spins up its own WordPress; nothing of ours is needed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the tree the directory would see (slug ops-kit-for-wordpress, main
      # file renamed, export-ignore strips tests/ and CI config).
      - name: Build the wordpress.org tree
        run: |
          bin/build-wporg-zip.sh HEAD build
          ls -R build/ops-kit-for-wordpress | head -40

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: build/ops-kit-for-wordpress
          categories: |
            general
            plugin_repo
            security
            performance
